; Firmware do ESP32 — C.A.FATEC.R.B (RoboCar Race 2026)
;
;   pio run              compila
;   pio run -t upload    grava no ESP32
;   pio device monitor   abre o monitor serial (115200)
;
; A porta é detectada sozinha. Se houver mais de um dispositivo conectado,
; passe explicitamente:  pio run -t upload --upload-port /dev/ttyUSB0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = time, colorize
upload_speed = 921600

build_flags =
    -Wall
    -Wextra
    ; Descomente para habilitar a entrada de rádio RC (ver docs/02-hardware.md).
    ; O rádio só pode ser usado em treino/teste; na prova oficial o
    ; regulamento proíbe qualquer controle externo.
    -DRC_INPUT_ENABLED=1

lib_deps =
    madhephaestus/ESP32Servo@^3.0.5

; Ambiente de bancada: mesma coisa, mas com log de depuração ligado.
[env:esp32dev-debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DROBOCAR_DEBUG=1
