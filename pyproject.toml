[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vista"
version = "0.1.0"
description = "Vista — IA do carro autônomo C.A.FATEC.R.B (RoboCar Race 2026, MASTER)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    # No Jetson, NÃO instale opencv pelo pip: use o do JetPack (com GStreamer).
    # O simulador roda no PC, onde o headless do pip serve.
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["vista_sim*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
